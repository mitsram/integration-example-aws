include classpath("application.conf")

node-address {
  protocol = http
  host     = "0.0.0.0"
  port     = 9324
  context-path = ""
}

rest-sqs {
  enabled              = true
  bind-port            = 9325
  bind-hostname        = "0.0.0.0"
  sqs-limits           = strict
}

queues {
  integration-queue {
    defaultVisibilityTimeout = 10 seconds
    delay                    = 0 seconds
    receiveMessageWait       = 0 seconds
  }
}
