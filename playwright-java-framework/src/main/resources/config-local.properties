# ── Local development environment ────────────────────────────────
# Services running directly on the host (npm run dev / docker compose up)

core.app1.url=http://localhost:4001
siebel.url=http://localhost:3002
api.gateway.url=http://localhost:8080

redis.host=localhost
redis.port=6380
pubsub.topic=integration-events

browser.headless=true
browser.type=chromium
browser.slowmo=0
browser.viewport.width=1280
browser.viewport.height=720

# ── Xray Cloud integration ───────────────────────────────────────
# Set xray.enabled=true and provide credentials to report results to Xray.
# Values can be overridden via system properties (-Dxray.client.id=...)
# or environment variables (XRAY_CLIENT_ID, XRAY_CLIENT_SECRET, etc.).
xray.enabled=false
xray.base.url=https://xray.cloud.getxray.app
xray.client.id=
xray.client.secret=
xray.project.key=
xray.test.plan.key=
xray.test.execution.key=
